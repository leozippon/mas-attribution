id: exp02_qwen_all_tasksets_single_agent_baseline
stage: 2
name: Qwen local vLLM all-tasksets - Single-agent, solo-role, and random-team baselines
purpose: Test whether MAS improves over non-collaborative baselines and estimate task
  difficulty.
research_questions:
- RQ1
- RQ3
hypotheses:
- H5
datasets:
- name: aime_2026
  task_file: data/processed/tasks/aime_2026_tasks.jsonl
  split: test
  max_tasks: 30
  task_selection: deterministic_first
- name: arc_agi_2
  task_file: data/processed/tasks/arc_agi_2_tasks.jsonl
  split: test
  max_tasks: 50
  task_selection: deterministic_first
- name: gpqa_diamond
  task_file: data/processed/tasks/gpqa_diamond_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: hle
  task_file: data/processed/tasks/hle_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: humaneval
  task_file: data/processed/tasks/humaneval_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: ifbench
  task_file: data/processed/tasks/ifbench_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: livecodebench
  task_file: data/processed/tasks/livecodebench_tasks.jsonl
  split: test
  max_tasks: 50
  task_selection: deterministic_first
- name: marble
  task_file: data/processed/tasks/marble_tasks.jsonl
  split: test
  max_tasks: 9
  task_selection: deterministic_first
- name: mbpp
  task_file: data/processed/tasks/mbpp_tasks.jsonl
  split: test
  max_tasks: 200
  task_selection: deterministic_first
- name: multiagentbench
  task_file: data/processed/tasks/multiagentbench_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: swebench_lite
  task_file: data/processed/tasks/swebench_lite_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: swebench_verified
  task_file: data/processed/tasks/swebench_verified_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: tau2_bench
  task_file: data/processed/tasks/tau2_bench_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
- name: teambench
  task_file: data/processed/tasks/teambench_tasks.jsonl
  split: test
  max_tasks: 100
  task_selection: deterministic_first
baselines:
- id: single_agent_coder
  type: single_agent
  agent: coder
  prompt_file: configs/benchmark_specs/prompts/coder.md
- id: single_agent_generalist
  type: single_agent
  agent: finalizer
  prompt_file: configs/benchmark_specs/prompts/finalizer.md
- id: solo_role
  type: solo_role
  roles:
  - planner
  - coder
  - debugger
  - verifier
  - critic
  - researcher
  - supervisor
  - finalizer
- id: random_team
  type: random_team
  team_size: 5
  num_samples_per_task: 3
seeds:
- 0
- 1
- 2
outputs:
  run_dir: data/runs/qwen/all_tasksets/single_agent
  trace_dir: data/traces/qwen/all_tasksets/baselines
  score_file: data/results/scores/qwen_all_tasksets_baseline_scores.jsonl
  single_agent_metadata_file: data/processed/metadata/qwen_all_tasksets_single_agent_baseline.jsonl
  difficulty_file: data/processed/metadata/qwen_all_tasksets_task_difficulty.jsonl
benchmark_specs:
  architecture_dir: configs/benchmark_specs/architectures
  agent_dir: configs/benchmark_specs/agents
  prompt_dir: configs/benchmark_specs/prompts
  permission_file: configs/benchmark_specs/permissions/permission_sets.yaml
model:
  backend: vllm
  name: qwen-local
  base_url: http://127.0.0.1:8000/v1
  homogeneous: true
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 180
logging:
  save_run_records: true
  save_full_trace: true
  save_tool_calls: true
  save_intermediate_outputs: true
  save_cost: true
  save_failure_type: true
  trace_graphs:
  - design_graph
  - trace_graph
  - dependency_graph
evaluation:
  primary_utility: task
  secondary_utilities:
  - net
  - process
  code_task_metric: pass_at_1
  non_code_task_metric: official_score
  bootstrap_confidence_interval: true
