id: exp08_generalization
stage: 8
name: Task- and communication-conditioned descriptive summaries
purpose: >
  Describe whether attribution patterns from Exp03-Exp07 look similar
  across pre-treatment task metadata and communication summaries. This
  experiment is analysis-only, makes no LLM calls, and does not support
  causal or inferential claims.
depends_on:
  - exp01_full_system
  - exp02_single_agent_baseline
  - exp03_loo_attribution
  - exp04_shapley_attribution
  - exp05_topology_intervention
  - exp06_role_intervention
  - exp07_permission_intervention
datasets:
  - name: aime_2026
    task_file: data/processed/tasks/aime_2026_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: gpqa_diamond
    task_file: data/processed/tasks/gpqa_diamond_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: hle
    task_file: data/processed/tasks/hle_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: arc_agi_2
    task_file: data/processed/tasks/arc_agi_2_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: ifbench
    task_file: data/processed/tasks/ifbench_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
sampling:
  unit: task
  selection_seed: 0
  task_selection: seeded_random
inputs:
  attribution_files:
    - data/results/exp03/loo_attribution.jsonl
    - data/results/exp04/shapley_banzhaf_attribution.jsonl
    - data/results/exp05/attribution.jsonl
    - data/results/exp06/attribution.jsonl
    - data/results/exp07/attribution.jsonl
  coalition_files:
    - data/results/exp04/coalition_scores.jsonl
    - data/results/exp05/coalitions.jsonl
    - data/results/exp06/coalitions.jsonl
    - data/results/exp07/coalitions.jsonl
  trace_files:
    - data/traces/exp03/exp03_loo_attribution_traces.jsonl
    - data/traces/exp04/exp04_shapley_attribution_traces.jsonl
    - data/traces/exp05/exp05_topology_intervention_traces.jsonl
    - data/traces/exp06/exp06_role_intervention_traces.jsonl
    - data/traces/exp07/exp07_permission_intervention_traces.jsonl
analysis:
  analysis_only: true
  descriptive_only: true
  no_llm: true
  causal_claims: false
  inferential_tests: false
  task_condition_axes:
    - dataset
    - difficulty_level
    - prompt_length_bin
    - task_type
  communication_condition_axes:
    - trace_length_bin
    - input_token_bin
    - output_token_bin
    - role_count_bin
    - null_agent_bin
  contribution_targets:
    - mean_contribution
    - role_ranking
    - negative_contribution_rate
    - descriptive_communication_correlation
  notes: >
    Task metadata is derived from the configured normalized task files.
    Score files are not used as covariates. Communication summaries and
    correlations are descriptive and non-causal.
outputs:
  summary_file: data/results/exp08/summary.jsonl
  task_slice_file: data/results/exp08/task_slices.jsonl
  communication_slice_file: data/results/exp08/communication_slices.jsonl
  ranking_file: data/results/exp08/role_rankings.jsonl
  correlation_file: data/results/exp08/communication_correlations.jsonl
  feature_file: data/results/exp08/attribution_features.jsonl
  statistics_file: data/results/exp08/statistics.jsonl
model:
  backend: analysis_only
  name: none
  homogeneous: true
logging:
  save_run_records: false
  save_full_trace: false
  save_tool_calls: false
  save_intermediate_outputs: false
  save_cost: false
  save_failure_type: true
evaluation:
  primary_utility: task
  notes: Descriptive summaries only. No causal or inferential claim.
