id: exp01_full_system
stage: 1
name: Full MAS architecture performance and cost
purpose: >
  Estimate complete-system utility, cost, and traces for each architecture
  on the fixed seeded seven-dataset subset. LiveCodeBench and SWE-bench
  Verified are prediction/export-only in-loop.
research_questions:
  - RQ1
  - RQ4
  - RQ6
hypotheses:
  - H1
  - H2
  - H5
datasets:
  - name: aime_2026
    task_file: data/processed/tasks/aime_2026_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: gpqa_diamond
    task_file: data/processed/tasks/gpqa_diamond_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: hle
    task_file: data/processed/tasks/hle_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: arc_agi_2
    task_file: data/processed/tasks/arc_agi_2_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: ifbench
    task_file: data/processed/tasks/ifbench_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: livecodebench
    task_file: data/processed/tasks/livecodebench_tasks.jsonl
    split: test
    max_tasks: 701
    task_selection: deterministic_first
    scoring: prediction_export_only
    in_loop_score: null
    notes: >
      In-loop score=None and passed=None. Not attribution-eligible until
      official results are joined.
  - name: swebench_verified
    task_file: data/processed/tasks/swebench_verified_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
    scoring: prediction_export_only
    in_loop_score: null
    notes: >
      In-loop score=None and passed=None. Not attribution-eligible until
      official results are joined.
architectures:
  include:
    - A1_pev
    - A2_chain
    - A3_dag
    - A4_metagpt_lite
    - A5_star
    - A6_debate
    - A7_graph
seeds:
  - 0
  - 1
  - 2
sampling:
  unit: task
  selection_seed: 0
  task_selection: seeded_random
outputs:
  run_dir: data/runs/exp01
  trace_dir: data/traces/exp01
  score_file: data/results/exp01/scores.jsonl
benchmark_specs:
  architecture_dir: configs/benchmark_specs/architectures
  agent_dir: configs/benchmark_specs/agents
  prompt_dir: configs/benchmark_specs/prompts
  permission_file: configs/benchmark_specs/permissions/permission_sets.yaml
model:
  backend: vllm
  name: qwen-local
  served_model_name: qwen-local
  base_url: http://127.0.0.1:8002/v1
  api_key: dummy
  weights_path: /Data/public/Qwen3.8-27B-FP8
  context_length: 262144
  tensor_parallel_size: 2
  max_num_seqs: 2
  managed_externally: true
  managed_by: zhangqy
  homogeneous: true
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 180
logging:
  save_run_records: true
  save_full_trace: true
  save_tool_calls: true
  save_intermediate_outputs: true
  save_cost: true
  save_failure_type: true
  trace_graphs:
    - design_graph
    - trace_graph
    - dependency_graph
evaluation:
  primary_utility: task
  secondary_utilities:
    - net
    - process
  local_scored_datasets:
    - aime_2026
    - gpqa_diamond
    - hle
    - arc_agi_2
    - ifbench
  prediction_export_only_datasets:
    - livecodebench
    - swebench_verified
  notes: >
    LiveCodeBench and SWE-bench Verified remain in-loop
    prediction/export-only (score=None, passed=None) and are not
    attribution-eligible until official results are joined.
