id: exp09_contribution_predictor
stage: 9
name: Cheap structural contribution predictor
status: unimplemented
purpose: >
  Planned design to predict top-k critical agents from topology, role,
  permission, trace, and task features without rerunning expensive
  attribution. This experiment is unimplemented and has no runner.
depends_on:
  - exp03_loo_attribution
  - exp04_shapley_attribution
  - exp08_generalization
research_questions:
  - RQ6
hypotheses:
  - H1
  - H2
  - H4
  - H5
  - H9
notes:
