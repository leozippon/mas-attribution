  - No executable models, training loops, or dataset splits are implemented.
  - Deprecated first-stage code-generation splits are not used.
feature_groups:
  - topology
  - role
  - permission
  - trace_behavior
  - task_metadata
targets:
  - loo_score
  - shapley_score
  - top1_critical_agent
outputs:
