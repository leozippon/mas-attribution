id: exp05_topology_intervention
stage: 5
name: Role-preserving topology rewiring
purpose: >
  Separate topology effects from role effects by fixing roles, position
  permissions, model, and tasks while changing communication topology.
  Execution is a single pass over controlled chain, star, and DAG graphs.
  LiveCodeBench and SWE-bench Verified are excluded because they remain
  score=None/passed=None in-loop.
depends_on:
  - exp03_loo_attribution
research_questions:
  - RQ4
  - RQ6
hypotheses:
  - H1
  - H2
  - H3
  - H8
datasets:
  - name: aime_2026
    task_file: data/processed/tasks/aime_2026_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: gpqa_diamond
    task_file: data/processed/tasks/gpqa_diamond_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: hle
    task_file: data/processed/tasks/hle_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: arc_agi_2
    task_file: data/processed/tasks/arc_agi_2_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: ifbench
    task_file: data/processed/tasks/ifbench_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
controlled_role_set:
  - planner
  - coder
  - verifier
  - critic
  - finalizer
controlled_permission_set:
  planner: planner
  coder: coder
  verifier: verifier
  critic: critic
  finalizer: finalizer
topology_variants:
  - id: controlled_chain
    template: chain
    description: >
      Single-pass linear Planner -> Coder -> Verifier -> Critic ->
      Finalizer workflow. Roles and position permissions stay fixed.
    edges:
      - [planner, coder]
      - [coder, verifier]
      - [verifier, critic]
      - [critic, finalizer]
      - [finalizer, final_answer]
  - id: controlled_star
    template: star
    center: finalizer
    description: >
      Bidirectional star-shaped design graph centered on the finalizer.
      Evaluated by a deterministic single-pass role order with the
      finalizer last. This is not hub dispatch or mediation. Roles and
      position permissions stay fixed.
    edges:
      - [finalizer, planner]
      - [planner, finalizer]
      - [finalizer, coder]
      - [coder, finalizer]
      - [finalizer, verifier]
      - [verifier, finalizer]
      - [finalizer, critic]
      - [critic, finalizer]
      - [finalizer, final_answer]
  - id: controlled_dag
    template: dag
    description: >
      Single-pass DAG. Planner branches to coding and verification, then
      critic integrates before finalizer. Roles and position permissions
      stay fixed.
    edges:
      - [planner, coder]
      - [planner, verifier]
      - [coder, critic]
      - [verifier, critic]
      - [critic, finalizer]
      - [finalizer, final_answer]
attribution:
  methods:
    - loo
  utility: task
  removal_protocol: null_agent_replacement
seeds:
  - 0
  - 1
  - 2
sampling:
  unit: task
  selection_seed: 0
  task_selection: seeded_random
outputs:
  run_dir: data/runs/exp05
  trace_dir: data/traces/exp05
  attribution_file: data/results/exp05/attribution.jsonl
  coalition_file: data/results/exp05/coalitions.jsonl
  statistics_file: data/results/exp05/statistics.jsonl
  score_file: data/results/exp05/scores.jsonl
benchmark_specs:
  architecture_dir: configs/benchmark_specs/architectures
  agent_dir: configs/benchmark_specs/agents
  prompt_dir: configs/benchmark_specs/prompts
  permission_file: configs/benchmark_specs/permissions/permission_sets.yaml
model:
  backend: vllm
  name: qwen-local
  served_model_name: qwen-local
  base_url: http://127.0.0.1:8000/v1
  api_key: dummy
  weights_path: /Data/public/Qwen3.8-27B-FP8
  context_length: 262144
  tensor_parallel_size: 2
  max_num_seqs: 2
  managed_externally: true
  managed_by: zhangqy
  homogeneous: true
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 180
logging:
  save_run_records: true
  save_full_trace: true
  save_tool_calls: true
  save_intermediate_outputs: true
  save_cost: true
  save_failure_type: true
  trace_graphs:
    - design_graph
    - trace_graph
    - dependency_graph
evaluation:
  primary_utility: task
  notes: >
    Only locally scored datasets are eligible for attribution.
    Prediction/export-only datasets are excluded.
