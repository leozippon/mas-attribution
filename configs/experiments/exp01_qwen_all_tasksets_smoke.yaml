id: exp01_qwen_all_tasksets_smoke
stage: 1
name: Qwen all-taskset full-system smoke test
purpose: Verify that every taskset can be loaded, prompted, evaluated, and recorded
  with Qwen on a minimal full-system setting.
research_questions:
- RQ1
- RQ4
- RQ6
hypotheses:
- H1
- H2
- H5
datasets:
- name: aime_2026
  task_file: data/processed/tasks/aime_2026_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: arc_agi_2
  task_file: data/processed/tasks/arc_agi_2_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: gpqa_diamond
  task_file: data/processed/tasks/gpqa_diamond_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: hle
  task_file: data/processed/tasks/hle_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: humaneval
  task_file: data/processed/tasks/humaneval_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: ifbench
  task_file: data/processed/tasks/ifbench_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: livecodebench
  task_file: data/processed/tasks/livecodebench_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: marble
  task_file: data/processed/tasks/marble_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: mbpp
  task_file: data/processed/tasks/mbpp_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: multiagentbench
  task_file: data/processed/tasks/multiagentbench_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: swebench_lite
  task_file: data/processed/tasks/swebench_lite_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: swebench_verified
  task_file: data/processed/tasks/swebench_verified_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: tau2_bench
  task_file: data/processed/tasks/tau2_bench_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
- name: teambench
  task_file: data/processed/tasks/teambench_tasks.jsonl
  split: test
  max_tasks: 1
  task_selection: deterministic_first
architectures:
  include:
  - A2_chain
  compatibility_policy: skip_incompatible_task_architecture_pairs
seeds:
- 0
sampling:
  unit: task
  fixed_order: true
  stratify_by:
  - dataset
  - difficulty
outputs:
  run_dir: data/runs/qwen/all_tasksets_smoke/full_system
  trace_dir: data/traces/qwen/all_tasksets_smoke/full_system
  score_file: data/results/scores/qwen_all_tasksets_smoke_full_system_scores.jsonl
  feature_file: data/results/features/qwen_all_tasksets_smoke_full_system_trace_features.jsonl
benchmark_specs:
  architecture_dir: configs/benchmark_specs/architectures
  agent_dir: configs/benchmark_specs/agents
  prompt_dir: configs/benchmark_specs/prompts
  permission_file: configs/benchmark_specs/permissions/permission_sets.yaml
model:
  backend: vllm
  name: qwen-local
  base_url: http://127.0.0.1:8000/v1
  homogeneous: true
  temperature: 0.2
  max_tokens: 512
  timeout_seconds: 180
logging:
  save_run_records: true
  save_full_trace: true
  save_tool_calls: true
  save_intermediate_outputs: true
  save_cost: true
  save_failure_type: true
  trace_graphs:
  - design_graph
  - trace_graph
  - dependency_graph
evaluation:
  primary_utility: task
  secondary_utilities:
  - net
  - process
  code_task_metric: pass_at_1
  non_code_task_metric: official_score
  bootstrap_confidence_interval: true
