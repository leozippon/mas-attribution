id: exp06_role_intervention
stage: 6
name: Topology-preserving Planner-Coder role swap
purpose: >
  Test whether contribution follows the functional Planner/Coder prompt
  or remains with the graph position. Topology and graph-position
  permissions stay fixed; only the Planner and Coder functional prompts
  are swapped. LiveCodeBench and SWE-bench Verified are excluded because
  they remain score=None/passed=None in-loop.
depends_on:
  - exp03_loo_attribution
  - exp05_topology_intervention
research_questions:
  - RQ3
  - RQ4
hypotheses:
  - H3
  - H5
datasets:
  - name: aime_2026
    task_file: data/processed/tasks/aime_2026_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: gpqa_diamond
    task_file: data/processed/tasks/gpqa_diamond_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: hle
    task_file: data/processed/tasks/hle_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: arc_agi_2
    task_file: data/processed/tasks/arc_agi_2_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: ifbench
    task_file: data/processed/tasks/ifbench_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
base_architectures:
  - A2_chain
  - A3_dag
  - A5_star
role_swaps:
  - id: planner_coder_swap
    swap:
      - planner
      - coder
    description: >
      Swap only the Planner and Coder functional/prompt assignments.
      Graph topology stays fixed. Graph-position permissions stay fixed
      on the original positions.
    controls:
      - same_topology
      - same_position_permissions
      - same_model
attribution:
  methods:
    - loo
  utility: task
  removal_protocol: null_agent_replacement
analysis:
  descriptive_only: true
  notes: >
    Graph-position permissions remain fixed. Attribution is reported
    over graph-position roles; metadata records the swapped functional
    prompt used at each position.
seeds:
  - 0
  - 1
  - 2
sampling:
  unit: task
  selection_seed: 0
  task_selection: seeded_random
outputs:
  run_dir: data/runs/exp06
  trace_dir: data/traces/exp06
  attribution_file: data/results/exp06/attribution.jsonl
  coalition_file: data/results/exp06/coalitions.jsonl
  score_file: data/results/exp06/scores.jsonl
  statistics_file: data/results/exp06/statistics.jsonl
benchmark_specs:
  architecture_dir: configs/benchmark_specs/architectures
  agent_dir: configs/benchmark_specs/agents
  prompt_dir: configs/benchmark_specs/prompts
  permission_file: configs/benchmark_specs/permissions/permission_sets.yaml
model:
  backend: vllm
  name: qwen-local
  served_model_name: qwen-local
  base_url: http://127.0.0.1:8000/v1
  api_key: dummy
  weights_path: /Data/public/Qwen3.8-27B-FP8
  context_length: 262144
  tensor_parallel_size: 2
  max_num_seqs: 2
  managed_externally: true
  managed_by: zhangqy
  homogeneous: true
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 180
logging:
  save_run_records: true
  save_full_trace: true
  save_tool_calls: true
  save_intermediate_outputs: true
  save_cost: true
  save_failure_type: true
  trace_graphs:
    - design_graph
    - trace_graph
    - dependency_graph
evaluation:
  primary_utility: task
  notes: >
    Only locally scored datasets are eligible for attribution.
    Prediction/export-only datasets are excluded.
