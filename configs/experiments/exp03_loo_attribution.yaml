id: exp03_loo_attribution
stage: 3
name: Leave-one-out contribution attribution
purpose: >
  Compute LOO agent contribution with null-agent replacement on the five
  locally scored datasets. LiveCodeBench and SWE-bench Verified are
  excluded because they remain score=None/passed=None in-loop.
depends_on:
  - exp01_full_system
research_questions:
  - RQ2
  - RQ4
  - RQ5
hypotheses:
  - H1
  - H2
  - H5
  - H7
datasets:
  - name: aime_2026
    task_file: data/processed/tasks/aime_2026_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: gpqa_diamond
    task_file: data/processed/tasks/gpqa_diamond_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: hle
    task_file: data/processed/tasks/hle_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: arc_agi_2
    task_file: data/processed/tasks/arc_agi_2_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
  - name: ifbench
    task_file: data/processed/tasks/ifbench_tasks.jsonl
    split: test
    max_tasks: 30
    task_selection: seeded_random
architectures:
  include:
    - A1_pev
    - A2_chain
    - A3_dag
    - A4_metagpt_lite
    - A5_star
    - A6_debate
    - A7_graph
attribution:
  method: loo
  utility: task
  primary_removal_protocol: null_agent_replacement
  reuse_full_system_runs: false
seeds:
  - 0
  - 1
  - 2
sampling:
  unit: task
  selection_seed: 0
  task_selection: seeded_random
outputs:
  run_dir: data/runs/exp03
  trace_dir: data/traces/exp03
  attribution_file: data/results/exp03/loo_attribution.jsonl
  score_file: data/results/exp03/scores.jsonl
benchmark_specs:
  architecture_dir: configs/benchmark_specs/architectures
  agent_dir: configs/benchmark_specs/agents
  prompt_dir: configs/benchmark_specs/prompts
  permission_file: configs/benchmark_specs/permissions/permission_sets.yaml
model:
  backend: vllm
  name: qwen-local
  served_model_name: qwen-local
  base_url: http://127.0.0.1:8000/v1
  api_key: dummy
  weights_path: /Data/public/Qwen3.8-27B-FP8
  context_length: 262144
  tensor_parallel_size: 2
  max_num_seqs: 2
  managed_externally: true
  managed_by: zhangqy
  homogeneous: true
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 180
logging:
  save_run_records: true
  save_full_trace: true
  save_tool_calls: true
  save_intermediate_outputs: true
  save_cost: true
  save_failure_type: true
  trace_graphs:
    - design_graph
    - trace_graph
    - dependency_graph
evaluation:
  primary_utility: task
  notes: >
    Only locally scored datasets are eligible for attribution.
    Prediction/export-only datasets are excluded.
