id: A5_star
name: Supervisor-Worker Star
family: centralized_coordination
description: >
  A star-shaped design graph with a supervisor and specialized workers.
  The current graph builder executes each role once in a deterministic
  single pass; bidirectional edges are not replayed as extra supervisor
  turns.

roles:
  - supervisor
  - planner
  - coder
  - verifier
  - critic
  - researcher
  - finalizer

canonical_roles:
  supervisor: supervisor
  planner: planner
  coder: coder
  verifier: verifier
  critic: critic
  researcher: researcher
  finalizer: finalizer

entrypoint: supervisor
terminal_nodes:
  - final_answer

edges:
  - [supervisor, planner]
  - [planner, supervisor]
  - [supervisor, researcher]
  - [researcher, supervisor]
  - [supervisor, coder]
  - [coder, supervisor]
  - [supervisor, verifier]
  - [verifier, supervisor]
  - [supervisor, critic]
  - [critic, supervisor]
  - [supervisor, finalizer]
  - [finalizer, final_answer]

orchestration:
  execution_mode: star
  routing_policy: supervisor_mediated_single_pass
  aggregation_policy: supervisor_to_finalizer
  stopping_condition: finalizer_emits_executable_answer
  max_rounds: 1
  notes: >
    Single-pass execution. Design-graph edges are not replayed as
    conversation rounds.

default_permissions:
  supervisor: supervisor
  planner: planner
  researcher: researcher
  coder: coder
  verifier: verifier
  critic: critic
  finalizer: finalizer

recommended_datasets:
  - aime_2026
  - gpqa_diamond
  - hle
  - arc_agi_2
  - ifbench

attribution_notes:
  removal_protocols:
    - hard_removal
    - null_agent_replacement
    - weak_model_replacement
  primary_questions:
    - Does high degree make the supervisor genuinely high contribution?
    - How much contribution comes from routing or final authority?
    - Can plan-code-check stay intact on a star design graph?

metadata:
  node_count: 7
  topology_type: star
  role_preserving_rewire_compatible: true
  paper_label: A5
