id: A7_graph
name: Graph Coordination
family: graph_coordination
description: >
  A richer coordination design graph with supervision, retrieval, tool
  use, memory, implementation, critique, verification, and finalization.
  The current graph builder executes each role once in a deterministic
  single pass; it does not iterate graph-state rounds.

roles:
  - supervisor
  - planner
  - retriever
  - memory_manager
  - tool_agent
  - coder
  - critic
  - verifier
  - finalizer

canonical_roles:
  supervisor: supervisor
  planner: planner
  retriever: researcher
  memory_manager: memory_manager
  tool_agent: tool_agent
  coder: coder
  critic: critic
  verifier: verifier
  finalizer: finalizer

entrypoint: supervisor
terminal_nodes:
  - final_answer

edges:
  - [supervisor, planner]
  - [supervisor, retriever]
  - [supervisor, memory_manager]
  - [planner, retriever]
  - [retriever, memory_manager]
  - [memory_manager, planner]
  - [planner, coder]
  - [retriever, coder]
  - [coder, tool_agent]
  - [tool_agent, coder]
  - [coder, critic]
  - [critic, coder]
  - [coder, verifier]
  - [tool_agent, verifier]
  - [critic, verifier]
  - [verifier, finalizer]
  - [memory_manager, finalizer]
  - [finalizer, supervisor]
  - [supervisor, final_answer]

orchestration:
  execution_mode: graph
  routing_policy: graph_single_pass
  aggregation_policy: supervisor_final
  stopping_condition: supervisor_or_finalizer_output
  max_rounds: 1
  notes: >
    Single-pass execution. Cycles and feedback edges describe the design
    graph only.

default_permissions:
  supervisor: supervisor
  planner: planner
  retriever: retriever
  memory_manager: memory_manager
  tool_agent: tool_agent
  coder: coder
  critic: critic
  verifier: verifier
  finalizer: finalizer

recommended_datasets:
  - aime_2026
  - gpqa_diamond
  - hle
  - arc_agi_2
  - ifbench

attribution_notes:
  removal_protocols:
    - hard_removal
    - null_agent_replacement
    - weak_model_replacement
  primary_questions:
    - "Do Myerson-style graph constraints change contribution allocation?"
    - "Do memory and tool access create information or permission bottlenecks?"
    - "Which graph-centrality features best predict critical agents?"

metadata:
  node_count: 9
  topology_type: graph
  role_preserving_rewire_compatible: true
  paper_label: A7
